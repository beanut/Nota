name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint and SwiftFormat
        run: brew install swiftlint swiftformat

      - name: SwiftFormat (lint only)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml

      - name: Package dependency rule
        run: scripts/check-dependency-rule.sh

  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Pick an iPad simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -E "^ +iPad Pro" | head -1 | sed -E 's/^ *(.*) \([0-9A-F-]{36}\).*/\1/')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"

      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
          key: deriv-${{ runner.os }}-${{ hashFiles('Nota.xcodeproj/project.pbxproj', 'Packages/*/Package.swift') }}
          restore-keys: |
            deriv-${{ runner.os }}-

      - name: Build Nota for iOS Simulator
        run: |
          xcodebuild build \
            -project Nota.xcodeproj \
            -scheme Nota \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Test InkKit and NotaCore packages on iPad simulator
        # InkKit's benchmarks run nightly in Release instead (.github/workflows/benchmarks.yml).
        run: |
          for package in InkKit NotaCore; do
            skip=""
            [ "$package" = InkKit ] && skip="-skip-testing:InkKitBenchmarks"
            (cd "Packages/$package" && xcodebuild test \
              -scheme "$package" \
              $skip \
              -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
              -skipPackagePluginValidation \
              CODE_SIGNING_ALLOWED=NO) || exit 1
          done
